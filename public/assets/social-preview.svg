<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Guthrie Complete Musician</title>
  <desc id="description">A 24-week guitar musicianship course.</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(930 90) rotate(125) scale(570 720)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff786e" stop-opacity=".36"/>
      <stop offset="1" stop-color="#0c0f11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="160" y1="0" x2="1040" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55d6c2"/>
      <stop offset="1" stop-color="#f0aa45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0c0f11"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <path d="M160 166h880" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <text x="160" y="255" fill="#55d6c2" font-family="system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="6">HEAR IT • UNDERSTAND IT • SAY SOMETHING</text>
  <text x="153" y="370" fill="#f4f0e7" font-family="system-ui, sans-serif" font-size="88" font-weight="850">Complete Musician</text>
  <text x="160" y="450" fill="#a9b1b2" font-family="system-ui, sans-serif" font-size="38">24 weeks of technique, time, ears, harmony and improvisation</text>
  <g transform="translate(160 505)">
    <rect width="88" height="64" rx="18" fill="#f0aa45"/>
    <text x="44" y="42" fill="#17100a" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="900">GCM</text>
  </g>
</svg>
